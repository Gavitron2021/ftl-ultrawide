name: Source checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s release/tests -v
      - name: Build 32-bit launcher
        shell: powershell
        run: ./release/build-native.ps1
